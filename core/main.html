<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISO-CORE Lite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9ed9f5;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; touch-action: none; }

  #damageFlash { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(230,30,30,0.05) 30%, rgba(230,30,30,0.55) 100%);
    opacity: 0; z-index: 45; transition: opacity 0.25s; }
  #damageFlash.on { opacity: 1; transition: opacity 0.05s; }

  #menuOverlay { position: fixed; inset: 0; z-index: 200;
    background: linear-gradient(135deg, #0a1a2a 0%, #16324a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; padding: 24px; }
  #menuOverlay.hidden { display: none; }
  #menuOverlay h1 { font-size: 34px; letter-spacing: 6px; margin-bottom: 6px;
    background: linear-gradient(90deg, #4ce0a8, #7dd8f0);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #menuOverlay .subtitle { font-size: 12px; letter-spacing: 3px; opacity: .5; margin-bottom: 36px; }
  .menu-btn { width: 240px; padding: 14px; margin: 6px;
    background: rgba(80,220,160,.12); color: #4ce0a8;
    border: 1.5px solid rgba(80,220,160,.4); border-radius: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: 2px;
    cursor: pointer; font-family: inherit; transition: .15s; }
  .menu-btn:hover { background: rgba(80,220,160,.25); transform: translateY(-2px); }
  .menu-btn.primary { background: #4ce0a8; color: #06231a; }
  .menu-btn.primary:hover { background: #6bffc4; }
  .menu-btn.ghost { background: transparent; border-color: rgba(255,255,255,.25); color: #fff; }
  .menu-btn.ghost:hover { background: rgba(255,255,255,.1); }
  #joinRow { display: none; align-items: center; gap: 8px; margin: 6px; }
  #joinRow.on { display: flex; }
  #joinRow input { width: 150px; padding: 12px; font-size: 16px; text-align: center;
    letter-spacing: 4px; font-weight: 800; font-family: inherit;
    background: rgba(0,0,0,.4); border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 10px; color: #fff; outline: none; }
  #joinRow input:focus { border-color: #4ce0a8; }

  #tutorialOverlay { position: fixed; inset: 0; z-index: 210;
    background: rgba(6,14,24,.9); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; padding: 20px; }
  #tutorialOverlay.on { display: flex; }
  #tutorialBox { background: rgba(18,28,38,.96); border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px; padding: 22px; max-width: 460px; width: 100%;
    max-height: 82vh; overflow-y: auto; color: #fff; }
  #tutorialBox h2 { font-size: 18px; letter-spacing: 3px; margin-bottom: 14px; color: #4ce0a8; }
  #tutorialBox h3 { font-size: 13px; letter-spacing: 2px; margin: 14px 0 6px; opacity: .7; }
  #tutorialBox p, #tutorialBox li { font-size: 12px; line-height: 1.75; opacity: .85; }
  #tutorialBox ul { padding-left: 18px; }
  #tutorialBox .key { display: inline-block; padding: 1px 7px; margin: 0 2px;
    background: rgba(80,220,160,.18); border: 1px solid rgba(80,220,160,.35);
    border-radius: 5px; font-size: 11px; font-weight: 800; color: #9df5c8; }
  .tutorial-close { margin-top: 16px; width: 100%; padding: 10px;
    background: #4ce0a8; color: #06231a; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; letter-spacing: 2px; }

  #multiplayerBar { position: fixed; left: 10px; top: 214px; z-index: 11;
    background: rgba(18,28,38,.72); color: #9df5c8;
    border: 1px solid rgba(80,220,160,.3); border-radius: 8px;
    padding: 4px 12px; font-size: 11px; font-weight: 800;
    letter-spacing: 1px; display: none; }
  #multiplayerBar.on { display: block; }
  #multiplayerBar .code { color: #fff; font-size: 13px; letter-spacing: 3px; }
  #multiplayerBar .players { color: #7dd8f0; font-size: 10px; margin-top: 2px; }

  #loadingTag { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(18,28,38,.95); color: #9df5c8;
    padding: 14px 26px; border-radius: 12px; border: 1px solid rgba(80,220,160,.4);
    font-size: 14px; font-weight: 700; z-index: 220; display: none; }
  #loadingTag.on { display: block; }

  #stats { position: fixed; left: 10px; top: 10px; z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
    background: rgba(18,28,38,.62); border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px; padding: 8px 10px; backdrop-filter: blur(8px); min-width: 178px; }
  .stat-row { display: flex; align-items: center; gap: 7px; }
  .stat-lbl { font-size: 10px; font-weight: 800; color: #fff; letter-spacing: 1px; width: 30px; opacity: .7; }
  .stat-bar { flex: 1; height: 10px; background: rgba(0,0,0,.45); border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); }
  .stat-fill { height: 100%; width: 100%; transition: width .25s ease; border-radius: 999px; }
  .stat-fill.hp { background: linear-gradient(90deg, #e8465a, #ff8899); }
  .stat-fill.fd { background: linear-gradient(90deg, #e0952c, #ffcc66); }
  .stat-num { font-size: 10px; font-weight: 800; color: #fff; width: 24px; text-align: right; opacity: .8; }

  #actionBar { position: fixed; left: 10px; top: 78px; z-index: 11; display: flex; gap: 6px; }
  #actionBar button { background: rgba(18,28,38,.72); color: #fff;
    border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
    padding: 4px 12px; font-size: 11px; font-weight: 800;
    cursor: pointer; font-family: inherit; letter-spacing: 1px; }
  #actionBar button:hover { background: rgba(80,220,160,.25); }
  #actionBar button:disabled { opacity: .35; cursor: not-allowed; }
  #actionBar button:disabled:hover { background: rgba(18,28,38,.72); }

  #weatherTag { position: fixed; left: 10px; top: 112px; z-index: 11;
    background: rgba(18,28,38,.72); color: #9df5c8;
    border: 1px solid rgba(80,220,160,.3); border-radius: 8px;
    padding: 4px 12px; font-size: 11px; font-weight: 800;
    letter-spacing: 1px; opacity: 0; transition: opacity .5s; }
  #weatherTag.on { opacity: 1; }
  #crystalTag { position: fixed; left: 10px; top: 146px; z-index: 11;
    background: rgba(30,40,60,.72); color: #7dd8f0;
    border: 1px solid rgba(125,216,240,.35); border-radius: 8px;
    padding: 4px 12px; font-size: 11px; font-weight: 800;
    letter-spacing: 1px; opacity: 0; transition: opacity .5s; }
  #crystalTag.on { opacity: 1; }
  #fpsTag { position: fixed; left: 10px; top: 180px; z-index: 11;
    background: rgba(18,28,38,.72); color: #aaccff;
    border: 1px solid rgba(120,180,255,.3); border-radius: 8px;
    padding: 4px 12px; font-size: 11px; font-weight: 800;
    letter-spacing: 1px; opacity: 0; transition: opacity .5s; }
  #fpsTag.on { opacity: 1; }

  #craft { position: fixed; right: 10px; top: 10px; width: 212px;
    max-height: calc(100vh - 130px); overflow-y: auto;
    background: rgba(18, 28, 38, .76); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px;
    color: #fff; z-index: 10; }
  #craft h3 { font-size: 12px; font-weight: 800; letter-spacing: 2px; opacity: .55; margin: 2px 4px 7px; text-transform: uppercase; }
  #craftTabs { display: flex; gap: 3px; margin-bottom: 8px; }
  .craft-tab { flex: 1; padding: 5px 2px; font-size: 10px; font-weight: 800;
    background: rgba(255,255,255,.06); color: #fff; opacity: .55;
    border: 1px solid rgba(255,255,255,.1); border-radius: 7px;
    cursor: pointer; font-family: inherit; letter-spacing: 1px; transition: .15s; }
  .craft-tab.active { background: rgba(80,220,160,.2); color: #9df5c8;
    border-color: rgba(80,220,160,.5); opacity: 1; }
  .craft-tab:hover { opacity: .85; }
  .recipe { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; margin-bottom: 3px;
    background: rgba(255,255,255,.05); border: 1px solid transparent; cursor: not-allowed; opacity: .38; transition: .15s; }
  .recipe.can { background: rgba(80, 220, 160, .16); border-color: rgba(80,220,160,.4); cursor: pointer; opacity: 1; }
  .recipe.can:hover { background: rgba(80, 220, 160, .3); }
  .recipe.owned { background: rgba(120,160,255,.14); border-color: rgba(120,160,255,.35); opacity: .8; }
  .recipe .ic { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; }
  .recipe .info { flex: 1; min-width: 0; }
  .recipe .nm { font-size: 12px; font-weight: 700; }
  .recipe .cost { font-size: 10px; opacity: .65; margin-top: 1px; line-height: 1.4; }

  #toasts { position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 30; }
  .toast { background: rgba(18,28,38,.82); color: #9df5c8; font-size: 13px; font-weight: 700;
    padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(120,255,190,.25);
    animation: floatUp 1.2s ease forwards; white-space: nowrap; }
  @keyframes floatUp {
    0% { transform: translateY(10px) scale(.85); opacity: 0; }
    20% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-26px); opacity: 0; }
  }

  #swimIndicator { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
    background: rgba(40,140,200,.78); color: #e8f9ff; font-size: 12px; font-weight: 700;
    padding: 4px 14px; border-radius: 999px; z-index: 11; backdrop-filter: blur(8px);
    border: 1px solid rgba(150,230,255,.4); opacity: 0; transition: opacity .35s;
    pointer-events: none; letter-spacing: 2px; }
  #swimIndicator.on { opacity: 1; }

  #placeHint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(80,220,160,.88); color: #06231a; font-size: 13px; font-weight: 800;
    padding: 7px 18px; border-radius: 999px; z-index: 12;
    opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #placeHint.on { opacity: 1; }

  #mineProgress { position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
    width: 180px; height: 12px; background: rgba(0,0,0,.55);
    border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
    z-index: 11; overflow: hidden; opacity: 0; transition: opacity .2s;
    pointer-events: none; }
  #mineProgress.on { opacity: 1; }
  #mineProgressFill { height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffbb44, #ff8866); border-radius: 999px; }

  #hint { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    background: rgba(18,28,38,.72); color: #fff; font-size: 12px; padding: 8px 16px;
    border-radius: 999px; z-index: 10; backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.14); transition: opacity .6s; white-space: nowrap; }
  #hint.hide { opacity: 0; pointer-events: none; }

  #hotbarWrap { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 10; }
  .slot { width: 38px; height: 38px; border-radius: 8px;
    background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.13);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; transition: .1s; touch-action: none; }
  .slot.filled { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); }
  .slot.sel { border-color: #4ce0a8; background: rgba(80,220,160,.22); box-shadow: 0 0 12px rgba(80,220,160,.55); }
  .slot.dragging { opacity: .3; }
  .slot .ct { position: absolute; bottom: 0; right: 3px;
    font-size: 10px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 4px #000; }
  .slot .num { position: absolute; top: 1px; left: 3px;
    font-size: 8px; font-weight: 800; color: #fff; opacity: .45; }
  #hotbar { display: flex; gap: 3px; background: rgba(18,28,38,.68);
    padding: 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(10px); }

  #dragGhost { position: fixed; pointer-events: none; z-index: 100;
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(80,220,160,.35); border: 2px solid #4ce0a8;
    display: none; align-items: center; justify-content: center;
    transform: translate(-50%, -50%); box-shadow: 0 0 16px rgba(80,220,160,.6); }
  #dragGhost.on { display: flex; }
  #dragGhost .ct { position: absolute; bottom: 1px; right: 4px;
    font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }

  #invPanel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
    background: rgba(18, 28, 38, .94); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 16px;
    padding: 14px; color: #fff; z-index: 25;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #invPanel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .panel-title { font-size: 12px; font-weight: 800; letter-spacing: 2px; opacity: .6; margin-bottom: 8px; text-transform: uppercase; }
  .inv-grid { display: grid; grid-template-columns: repeat(6, 42px); grid-template-rows: repeat(6, 42px); gap: 4px; }
  .inv-grid .slot { width: 42px; height: 42px; }

  #furnacePanel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
    background: rgba(28, 20, 14, .95); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,170,80,.3); border-radius: 16px;
    padding: 16px; color: #fff; z-index: 25; min-width: 280px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #furnacePanel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .furnace-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0; }
  .furnace-slot { width: 56px; height: 56px; border-radius: 10px;
    background: rgba(0,0,0,.4); border: 1.5px solid rgba(255,170,80,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: .12s; touch-action: none; }
  .furnace-slot:hover { border-color: rgba(255,170,80,.7); background: rgba(255,170,80,.1); }
  .furnace-slot .fname { font-size: 9px; opacity: .7; margin-top: 2px; }
  .furnace-slot .fcount { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: 800; text-shadow: 0 1px 3px #000; }
  .furnace-arrow { font-size: 20px; color: #ff8a3d; }
  .furnace-progress { width: 100%; height: 10px; background: rgba(0,0,0,.5);
    border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,170,80,.25); margin-top: 6px; }
  .furnace-progress-fill { height: 100%; background: linear-gradient(90deg, #ff8a3d, #ffcc66); width: 0%; transition: width .1s linear; }
  .panel-close { position: absolute; top: 10px; right: 12px; cursor: pointer;
    font-size: 16px; opacity: .5; background: none; border: none; color: #fff; font-family: inherit; }
  .panel-close:hover { opacity: 1; }

  #chestPanel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9);
    background: rgba(38, 26, 16, .95); backdrop-filter: blur(14px);
    border: 1px solid rgba(200,150,90,.3); border-radius: 16px;
    padding: 14px; color: #fff; z-index: 25;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #chestPanel.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .chest-grid { display: grid; grid-template-columns: repeat(6, 42px); grid-template-rows: repeat(3, 42px); gap: 4px; }
  .chest-grid .slot { width: 42px; height: 42px; }

  #dpad { position: fixed; right: 14px; bottom: 72px; z-index: 10;
    display: none; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px);
    gap: 5px; opacity: .75; }
  .dbtn { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.32);
    border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; user-select: none; backdrop-filter: blur(6px); }
  .dbtn:active { background: rgba(255,255,255,.4); }

  #win, #gameover { position: fixed; inset: 0; backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #win { background: rgba(8,16,26,.78); }
  #gameover { background: rgba(30, 6, 8, .88); }
  #win.show, #gameover.show { opacity: 1; pointer-events: auto; }
  #win .big { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #win h1, #gameover h1 { font-size: 24px; margin: 16px 0 6px; letter-spacing: 4px; }
  #win p, #gameover p { opacity: .55; font-size: 13px; margin-bottom: 26px; }
  #win button, #gameover button { background: #4ce0a8; color: #06231a; border: none;
    padding: 12px 32px; border-radius: 999px; font-size: 15px; font-weight: 800;
    cursor: pointer; font-family: inherit; }
  #gameover button { background: #e8465a; color: #fff; }
  #win button:hover { background: #6bffc4; }
  #gameover button:hover { background: #ff6677; }
  #win #winClose { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3);
    margin-top: 8px; padding: 8px 24px; font-size: 12px; }
  #win #winClose:hover { background: rgba(255,255,255,.1); }

  @media (max-width: 720px) {
    #craft { width: 162px; padding: 6px; }
    .recipe { padding: 4px 6px; gap: 5px; }
    .recipe .nm { font-size: 11px; }
    .recipe .cost { font-size: 9px; }
    #stats { min-width: 150px; padding: 6px 8px; }
    .inv-grid { grid-template-columns: repeat(6, 36px); grid-template-rows: repeat(6, 36px); }
    .inv-grid .slot { width: 36px; height: 36px; }
    .chest-grid { grid-template-columns: repeat(6, 36px); grid-template-rows: repeat(3, 36px); }
    .chest-grid .slot { width: 36px; height: 36px; }
    .craft-tab { font-size: 9px; }
  }
</style>
</head>
<body>

<div id="damageFlash"></div>

<div id="menuOverlay">
  <h1>ISO-CORE Lite</h1>
  <div class="subtitle" id="menuSubtitle">像素沙盒建造</div>
  <button class="menu-btn primary" id="btnSingle">🎮 单机模式</button>
  <button class="menu-btn" id="btnHost">🌐 创建房间</button>
  <button class="menu-btn ghost" id="btnJoinToggle">🔗 加入房间</button>
  <div id="joinRow">
    <input id="joinCode" type="text" maxlength="6" placeholder="房间码" inputmode="numeric" autocomplete="off">
    <button class="menu-btn" style="margin:0;width:auto;padding:12px 18px;" id="btnJoinGo">连接</button>
  </div>
  <button class="menu-btn ghost" id="btnTutorial" data-i18n="tutorialBtn">📖 教程</button>
  <button class="menu-btn ghost" id="menuLangBtn" style="width:auto;padding:10px 24px;margin-top:14px;">中文 / EN</button>
</div>

<div id="tutorialOverlay">
  <div id="tutorialBox">
    <h2 id="tutTitle">教程</h2>
    <div id="tutContent"></div>
    <button class="tutorial-close" id="tutClose" data-i18n="tutorialClose">关闭</button>
  </div>
</div>

<div id="multiplayerBar">
  <div>房间码: <span class="code" id="roomCodeDisplay">------</span></div>
  <div class="players" id="playerListDisplay">玩家: 1</div>
</div>

<div id="loadingTag"></div>

<div id="stats">
  <div class="stat-row">
    <span class="stat-lbl" data-i18n="health">生命</span>
    <div class="stat-bar"><div class="stat-fill hp" id="healthBar"></div></div>
    <span class="stat-num" id="healthNum">100</span>
  </div>
  <div class="stat-row">
    <span class="stat-lbl" data-i18n="hunger">饥饿</span>
    <div class="stat-bar"><div class="stat-fill fd" id="hungerBar"></div></div>
    <span class="stat-num" id="hungerNum">100</span>
  </div>
</div>

<div id="actionBar">
  <button id="langBtn">EN</button>
  <button id="saveBtn" data-i18n="saveBtn">保存</button>
  <button id="loadBtn" data-i18n="loadBtn">读取</button>
</div>

<div id="weatherTag"></div>
<div id="crystalTag">按 H 传送回水晶</div>
<div id="fpsTag"></div>

<div id="craft">
  <h3 data-i18n="craft">合成台</h3>
  <div id="craftTabs">
    <button class="craft-tab active" data-tab="tools" id="tabTools">工具</button>
    <button class="craft-tab" data-tab="buildings" id="tabBuildings">建筑</button>
    <button class="craft-tab" data-tab="materials" id="tabMaterials">材料</button>
  </div>
  <div id="recipes"></div>
</div>

<div id="toasts"></div>
<div id="swimIndicator" data-i18n="swimming">游泳中</div>
<div id="placeHint"></div>
<div id="mineProgress"><div id="mineProgressFill"></div></div>
<div id="hint" data-i18n="hintMain">WASD 移动 · 左右方向键旋转视角 · 1-9 快捷栏 · Q 丢物品 · E 背包 · H 传送回水晶 · 右键熔炉/箱子</div>

<div id="dragGhost"><span class="ct"></span></div>

<div id="invPanel">
  <button class="panel-close" onclick="window.closeInv && window.closeInv()">✕</button>
  <div class="panel-title" data-i18n="inventory">背包 (E 关闭)</div>
  <div class="inv-grid" id="invGrid"></div>
</div>

<div id="furnacePanel">
  <button class="panel-close" onclick="window.closeFurnace && window.closeFurnace()">✕</button>
  <div class="panel-title" id="furnaceTitle" data-i18n="furnace">熔炉</div>
  <div class="furnace-row">
    <div class="furnace-slot" id="fInput" data-drop-zone="furnace" data-drop-idx="fInput">
      <div id="fInputIcon"></div>
      <div class="fname" id="fInputName">铁矿石</div>
      <div class="fcount" id="fInputCount"></div>
    </div>
    <div class="furnace-arrow">→</div>
    <div class="furnace-slot" id="fFuel" data-drop-zone="furnace" data-drop-idx="fFuel">
      <div id="fFuelIcon"></div>
      <div class="fname" data-i18n="coal">煤</div>
      <div class="fcount" id="fFuelCount"></div>
    </div>
    <div class="furnace-arrow">→</div>
    <div class="furnace-slot" id="fOutput" data-drop-zone="furnace" data-drop-idx="fOutput">
      <div id="fOutputIcon"></div>
      <div class="fname" id="fOutputName">铁锭</div>
      <div class="fcount" id="fOutputCount"></div>
    </div>
  </div>
  <div class="furnace-progress"><div class="furnace-progress-fill" id="fProgress"></div></div>
  <div style="font-size:10px;opacity:.55;text-align:center;margin-top:8px;" id="furnaceTipText" data-i18n="furnaceTip">
    拖动左侧槽放入铁矿石 · 拖动中间放入煤 · 拖动右侧取出铁锭
  </div>
</div>

<div id="chestPanel">
  <button class="panel-close" onclick="window.closeChest && window.closeChest()">✕</button>
  <div class="panel-title" data-i18n="chest">箱子</div>
  <div class="chest-grid" id="chestGrid"></div>
</div>

<div id="hotbarWrap"><div id="hotbar"></div></div>

<div id="dpad">
  <div></div><div class="dbtn" data-dir="up">▲</div><div></div>
  <div class="dbtn" data-dir="left">◀</div><div></div><div class="dbtn" data-dir="right">▶</div>
  <div></div><div class="dbtn" data-dir="down">▼</div><div></div>
</div>

<div id="win">
  <div class="big">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
      <path d="M12 2 L20 10 L12 22 L4 10 Z" fill="#7dd8f0"/>
      <path d="M12 2 L20 10 L12 10 Z" fill="#a8e8f8"/>
      <path d="M4 10 L12 10 L12 22 Z" fill="#5ab8d8"/>
    </svg>
  </div>
  <h1 data-i18n="crystalBuilt">大地水晶已激活</h1>
  <p data-i18n="crystalBuiltMsg">你在这片随机生成的世界里建立了自己的核心</p>
  <button onclick="location.reload()" data-i18n="restart">再来一次</button>
  <button id="winClose" data-i18n="keepPlaying">继续游戏</button>
</div>

<div id="gameover">
  <div class="big">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="#7a2a2a"/>
      <rect x="8" y="8" width="8" height="8" rx="1" fill="#3a0a0a"/>
    </svg>
  </div>
  <h1 data-i18n="starved">你饿倒了</h1>
  <p data-i18n="starvedMsg">下一次记得多采集一些浆果</p>
  <button onclick="location.reload()" data-i18n="restart">重新开始</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
